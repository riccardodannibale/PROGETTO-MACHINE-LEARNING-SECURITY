name: Repository checks

on:
  push:
  pull_request:

jobs:
  published-results-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.2 scikit-learn==1.9.1
          python -m pip install --disable-pip-version-check torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify published E2 and E3 summaries
        run: python scripts/verify_published_results.py
      - name: Run all repository tests
        run: |
          set -e
          for test in tests/test_*.py; do
            echo "==> $test"
            python "$test"
          done
