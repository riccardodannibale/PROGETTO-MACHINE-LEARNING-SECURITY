<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>
.h{font:700 38px Arial,sans-serif;fill:#172033}.sub{font:20px Arial,sans-serif;fill:#64748b}.box{fill:#fff;stroke:#334155;stroke-width:2.5;rx:18}.txt{font:700 25px Arial,sans-serif;fill:#1e293b}.small{font:19px Arial,sans-serif;fill:#334155}.phase{fill:#fffdf6;stroke:#e6b84a;stroke-width:4;rx:32}.future{fill:#f7fbff;stroke:#7ba7e1;stroke-width:4;stroke-dasharray:12 9;rx:32}.pill{font:700 22px Arial,sans-serif}.arr{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arr)}</style></defs>
<rect width="1200" height="1360" fill="#fff"/><text x="600" y="64" text-anchor="middle" class="h">BEYOND THE X-RAY</text><text x="600" y="102" text-anchor="middle" class="sub">Workflow del progetto — stato della FASE 1</text>
<rect x="160" y="145" width="880" height="108" rx="22" fill="#fbe3e3" stroke="#d97777" stroke-width="3"/><text x="600" y="187" text-anchor="middle" class="txt">Problema generale</text><text x="600" y="225" text-anchor="middle" class="small">Individuare informazioni nascoste nei pesi delle reti neurali</text><path d="M600 253 V292" class="arr"/>
<rect x="105" y="305" width="990" height="560" class="phase"/><rect x="145" y="326" width="300" height="54" rx="20" fill="#fff0c2" stroke="#d3a33c" stroke-width="2"/><text x="295" y="361" text-anchor="middle" class="pill" fill="#8a5b00">FASE 1 — COMPLETATA</text>
<rect x="230" y="412" width="740" height="108" class="box"/><text x="600" y="455" text-anchor="middle" class="txt">E1 — Baseline Model X-Ray</text><text x="600" y="491" text-anchor="middle" class="small">Il detector riconosce le modifiche X-LSB?</text><path d="M600 520 V560" class="arr"/>
<rect x="230" y="575" width="740" height="108" class="box"/><text x="600" y="618" text-anchor="middle" class="txt">E2 — Generalizzazione OOD</text><text x="600" y="654" text-anchor="middle" class="small">Il detector trasferisce la detection a SPREAD_v0?</text><path d="M600 683 V723" class="arr"/>
<rect x="230" y="738" width="740" height="92" class="box"/><text x="600" y="777" text-anchor="middle" class="txt">E3 — Experimental Controls</text><text x="600" y="810" text-anchor="middle" class="small">Controlli matched, metadati e stabilità dei benigni</text><path d="M600 865 V915" class="arr"/>
<rect x="105" y="930" width="990" height="335" class="future"/><rect x="145" y="951" width="420" height="54" rx="20" fill="#e6f0ff" stroke="#7ba7e1" stroke-width="2"/><text x="355" y="986" text-anchor="middle" class="pill" fill="#285b9a">FASE 2 — LAVORO FUTURO</text>
<rect x="230" y="1032" width="740" height="88" class="box"/><text x="600" y="1068" text-anchor="middle" class="txt">E4 — Noisy Channel Analysis</text><text x="600" y="1100" text-anchor="middle" class="small">Nuovo embedding, rumore post-embedding e robustezza</text><path d="M600 1120 V1150" class="arr"/>
<rect x="230" y="1163" width="740" height="78" rx="18" fill="#e5f4e8" stroke="#83b88a" stroke-width="2.5"/><text x="600" y="1197" text-anchor="middle" class="txt">Remediation e confronto dei detector</text><text x="600" y="1225" text-anchor="middle" class="small">Noise-aware training — non incluso nei risultati di FASE 1</text><text x="600" y="1310" text-anchor="middle" class="sub">Questa relazione documenta esclusivamente E1, E2 ed E3.</text></svg>