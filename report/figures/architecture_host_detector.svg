<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L10,3 z" fill="#334155"/></marker><style>
.title{font:700 36px Arial,sans-serif;fill:#172033}.sub{font:19px Arial,sans-serif;fill:#64748b}.h{font:700 23px Arial,sans-serif;fill:#172033}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:16px Arial,sans-serif;fill:#64748b}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.cnn{fill:#f2f6fb;stroke:#7891ad;stroke-width:2.5;rx:18}.weight{fill:#fff8e8;stroke:#d9a441;stroke-width:2.5;rx:18}.emb{fill:#fff0e8;stroke:#df976e;stroke-width:2.5;rx:18}.rep{fill:#edf5ff;stroke:#81a9d8;stroke-width:2.5;rx:18}.det{fill:#f0ebff;stroke:#9a86ce;stroke-width:3;rx:22}.green{fill:#e3f3e7;stroke:#77ad82;stroke-width:2.5;rx:16}.red{fill:#fbe4e4;stroke:#d17a7a;stroke-width:2.5;rx:16}</style></defs>
<rect width="1500" height="900" fill="#fff"/><text x="750" y="55" text-anchor="middle" class="title">Architettura del sistema: host model e detector separati</text><text x="750" y="88" text-anchor="middle" class="sub">Il payload modifica i pesi della CNN sorgente; Model X-Ray analizza una rappresentazione di quei pesi</text>
<rect x="35" y="300" width="205" height="180" class="cnn"/><text x="137" y="345" text-anchor="middle" class="h">GHRP / STL10</text><text x="137" y="380" text-anchor="middle" class="t">Model Zoo</text><text x="137" y="417" text-anchor="middle" class="t">1.000 checkpoint</text><text x="137" y="448" text-anchor="middle" class="s">Small CNN pre-addestrate</text><path d="M240 390 H285" class="line"/>
<rect x="300" y="260" width="270" height="280" class="cnn"/><text x="435" y="298" text-anchor="middle" class="h">Host model (CNN)</text><text x="435" y="328" text-anchor="middle" class="s">Checkpoint sorgente</text>
<g stroke="#6b7f95" stroke-width="2" fill="#fff"><circle cx="350" cy="380" r="18"/><circle cx="350" cy="435" r="18"/><circle cx="350" cy="490" r="18"/><circle cx="455" cy="402" r="18"/><circle cx="455" cy="468" r="18"/><circle cx="520" cy="435" r="18"/><path d="M368 380 L437 402 M368 380 L437 468 M368 435 L437 402 M368 435 L437 468 M368 490 L437 402 M368 490 L437 468 M473 402 L502 435 M473 468 L502 435" fill="none"/></g><text x="435" y="521" text-anchor="middle" class="s">Pesi originali: w (2.864 float32)</text>
<rect x="300" y="120" width="270" height="76" class="emb"/><text x="435" y="152" text-anchor="middle" class="h">Payload sintetico</text><text x="435" y="180" text-anchor="middle" class="s">Messaggio inerte</text>
<rect x="300" y="600" width="270" height="96" class="weight"/><text x="435" y="638" text-anchor="middle" class="h">Embedding nei pesi</text><text x="435" y="670" text-anchor="middle" class="t">w' = w + Δw</text><path d="M435 196 V220 H620 V648 H575" class="line"/><text x="630" y="560" class="s">payload verso i pesi</text><path d="M435 540 V597" class="line"/>
<rect x="300" y="735" width="270" height="76" class="weight"/><text x="435" y="766" text-anchor="middle" class="h">Pesi steganografati</text><text x="435" y="793" text-anchor="middle" class="s">w'</text><path d="M435 696 V732" class="line"/>
<rect x="660" y="245" width="280" height="95" class="rep"/><text x="800" y="282" text-anchor="middle" class="h">Pesi benigni</text><text x="800" y="315" text-anchor="middle" class="t">w</text><rect x="660" y="610" width="280" height="95" class="rep"/><text x="800" y="648" text-anchor="middle" class="h">Pesi steganografati</text><text x="800" y="680" text-anchor="middle" class="t">w'</text>
<path d="M570 390 H615 V292 H657" class="line"/><path d="M570 773 H615 V657 H657" class="line"/><rect x="660" y="405" width="280" height="120" class="rep"/><text x="800" y="447" text-anchor="middle" class="h">Weight representation</text><text x="800" y="481" text-anchor="middle" class="t">GF image 100 × 100</text><text x="800" y="507" text-anchor="middle" class="s">Stessa pipeline di rappresentazione</text><path d="M800 340 V402" class="line"/><path d="M800 610 V528" class="line"/>
<path d="M940 465 H1000" class="line"/><rect x="1015" y="355" width="260" height="220" class="det"/><text x="1145" y="402" text-anchor="middle" class="h">Model X-Ray</text><text x="1145" y="442" text-anchor="middle" class="t">Siamese few-shot CNN</text><text x="1145" y="480" text-anchor="middle" class="t">Centroid scoring</text><text x="1145" y="522" text-anchor="middle" class="s">1-NN secondario</text><path d="M1275 465 H1310" class="line"/>
<rect x="1325" y="355" width="150" height="82" class="green"/><text x="1400" y="405" text-anchor="middle" class="h">Benign</text><rect x="1325" y="470" width="150" height="82" class="red"/><text x="1400" y="520" text-anchor="middle" class="h">Stego</text><path d="M1310 465 V396 H1322" class="line"/><path d="M1310 465 V511 H1322" class="line"/>
<rect x="300" y="835" width="975" height="52" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="787" y="868" text-anchor="middle" class="t">Il payload è inserito nei pesi dell'host CNN, non negli input e non nei pesi del detector.</text></svg>